<!-- Application shell with simple top nav -->
<header class="topbar" style="background:#3f51b5;color:#fff;padding:12px 24px;">
  <div style="max-width:980px;margin:0 auto;display:flex;align-items:center;gap:16px;">
    <h1 style="margin:0;font-size:1.2rem;">TaskManagementApp</h1>
    <nav style="margin-left:16px;">
      <a routerLink="/dashboard" style="color:inherit;margin-right:12px;text-decoration:none;">Dashboard</a>
      <a routerLink="/tasks" style="color:inherit;margin-right:12px;text-decoration:none;">Tareas</a>
    </nav>
    <div style="margin-left:auto;font-size:0.9rem;opacity:0.9;">
      <span *ngIf="isLoggedIn$ | async">
        <button (click)="logout()" style="background:none;border:none;color:white;cursor:pointer;font-size:0.9rem;margin-left:12px;">Logout</button>
      </span>
      Estado: <span *ngIf="isOnline(); else offline">Online</span><ng-template #offline>Offline</ng-template>
    </div>
  </div>
</header>

<main class="app-shell" style="padding:24px;max-width:980px;margin:0 auto;">
  <router-outlet></router-outlet>
</main>
